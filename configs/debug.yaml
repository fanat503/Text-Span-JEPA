# Text-Span JEPA — Debug configuration (tiny, fast)
meta:
  seed: 42
  use_bfloat16: false
  model_name: text_span_jepa_debug

data:
  batch_size: 4
  max_seq_len: 64
  tokenizer: gpt2
  num_workers: 0
  root_path: /kaggle/input/wikitext-103
  mask_ratio: 0.3
  span_length_range: [2, 5]

model:
  embed_dim: 128
  encoder_depth: 2
  num_heads: 4
  mlp_ratio: 2.0
  qkv_bias: true
  drop_rate: 0.0
  attn_drop_rate: 0.0
  drop_path_rate: 0.0
  predictor_embed_dim: 64
  predictor_depth: 2
  future_offsets: [1, 4]
  num_refine_steps: 1
  refine_step_size: 0.1
  decoder_bias: false
  variance_margin: 1.0
  centering_momentum: 0.9
  ema_tau_start: 0.996
  ema_tau_end: 1.0
  lambda_span: 1.0
  lambda_future: 0.5
  lambda_decoder: 0.1
  lambda_variance: 0.1
  lambda_covariance: 0.04
  mask_ratio_start: 0.15
  mask_ratio_end: 0.3
  future_warmup_steps: 10

optimization:
  ema: [0.996, 1.0]
  epochs: 2
  ipe_scale: 1.0
  lr: 0.0005
  start_lr: 0.0001
  final_lr: 1.0e-5
  warmup: 1
  weight_decay: 0.04
  final_weight_decay: 0.4

logging:
  folder: output_debug/
  log_freq: 1
  write_tag: debug

meta:
  seed: 42
  use_bfloat16: true
  model_name: data2vec_baseline
  load_checkpoint: false
  dataset: wikitext103
data:
  batch_size: 64
  max_seq_len: 512
  tokenizer: gpt2
  num_workers: 4
  root_path: data/wikitext-103
  mask_ratio: 0.35
model:
  embed_dim: 768
  encoder_depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  ema_schedule: cosine
  gradient_checkpointing: false
  jspace_variance_threshold: 0.1
  jspace_k_workspace: 25
  future_warmup_steps: 5000
data2vec:
  head_layers: 2
  loss_beta: 5.0
  loss_scale: null
  ema_decay: 0.999
  ema_end_decay: 0.9999
  ema_anneal_end_step: 100000
  average_top_k_layers: 8
optimization:
  epochs: 50
  lr: 0.001
  start_lr: 0.0002
  final_lr: 1.0e-05
  warmup: 10
  weight_decay: 0.04
logging:
  folder: output/wikitext/data2vec-base/
  log_freq: 10
  write_tag: data2vec_wikitext

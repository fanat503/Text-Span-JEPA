meta:
  seed: 42
  use_bfloat16: true
  model_name: mlm_small
  load_checkpoint: false
  dataset: wikitext103
data:
  batch_size: 128
  max_seq_len: 512
  tokenizer: gpt2
  num_workers: 4
  root_path: data/wikitext-103
  mask_ratio: 0.15
  span_length_range:
  - 1
  - 1
model:
  embed_dim: 640
  encoder_depth: 10
  num_heads: 10
  mlp_ratio: 4.0
  qkv_bias: true
  drop_rate: 0.1
  attn_drop_rate: 0.0
  drop_path_rate: 0.1
  ema_schedule: cosine
  gradient_checkpointing: false
  jspace_variance_threshold: 0.1
  jspace_k_workspace: 25
  future_warmup_steps: 5000
  predictor_embed_dim: 320
  lambda_predictive_rank: 0.0
  use_cgn: false
  cgn_n_groups: 8
  cgn_tau_start: 1.0
  cgn_tau_end: 0.1
  cgn_anneal_steps: 10000
  lambda_cgn_ortho: 0.0
  use_swip: false
  swip_k_workspace: null
  swip_target_variance: 1.0
  lambda_swip: 0.0
optimization:
  epochs: 30
  ipe_scale: 1.0
  lr: 0.0005
  start_lr: 0.0001
  final_lr: 1.0e-05
  warmup: 10
  weight_decay: 0.01
  final_weight_decay: 0.01
  grad_accum_steps: 2
logging:
  folder: output/wikitext/mlm-small-100m/
  log_freq: 10
  write_tag: mlm_small_100m

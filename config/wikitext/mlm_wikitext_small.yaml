# MLM Baseline — WikiText-103 small (~100M params)
# Same encoder architecture as Text-Span JEPA for fair comparison
meta:
  seed: 42
  use_bfloat16: true
  model_name: mlm_small
  load_checkpoint: false
  dataset: wikitext103
data:
  batch_size: 128
  max_seq_len: 512
  tokenizer: gpt2
  num_workers: 4
  root_path: data/wikitext-103
  mask_ratio: 0.15
  span_length_range: [1, 1]  # Random token masking (not span)
model:
  embed_dim: 640
  encoder_depth: 10
  num_heads: 10
  mlp_ratio: 4.0
  qkv_bias: true
  drop_rate: 0.1
  attn_drop_rate: 0.0
  drop_path_rate: 0.1
optimization:
  epochs: 30
  ipe_scale: 1.0
  lr: 0.0005
  start_lr: 0.0001
  final_lr: 1.0e-5
  warmup: 10
  weight_decay: 0.01
  final_weight_decay: 0.01
  grad_accum_steps: 2
logging:
  folder: output/wikitext/mlm-small-100m/
  log_freq: 10
  write_tag: mlm_small_100m

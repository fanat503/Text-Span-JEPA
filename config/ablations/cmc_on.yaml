model:
  use_cmc: true
  cmc_mode: interval
  cmc_interval: 10
  lambda_cmc: 0.1
  use_gac: false
  gac_gamma: 0.01
  gac_tau_grad: 0.0001
  gac_warmup_steps: 1000
  lambda_gac: 0.0
  use_sta: false
  sta_eta: 0.01
  sta_ema_beta: 0.999
  sta_warmup_steps: 500
  sta_update_interval: 10
  lambda_sta: 0.0
  use_rdc: false
  rdc_eta: 0.01
  rdc_ema_beta: 0.999
  rdc_warmup_steps: 500
  rdc_k_workspace: null
  lambda_rdc: 0.0
  lambda_swip: 0.0
  lambda_spc: 0.0
  lambda_wsd: 0.0
  lambda_puc: 0.0
